services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      ENVIRONMENT: production
    restart: unless-stopped
    expose: ["8000"]
    networks:
      classroom:
        ipv4_address: 172.28.0.3
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health',timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
  web:
    image: caddy:2.10.2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the production hostname}
    ports: ["80:80", "443:443"]
    networks:
      classroom:
        ipv4_address: 172.28.0.2
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${FRONTEND_BUILD_DIR:-../frontend/build}
        target: /srv
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
networks:
  classroom:
    ipam:
      config:
        - subnet: 172.28.0.0/24
