name: Verify classroom backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ntou_integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_owner -d ntou_integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test_owner:ci-test-only@127.0.0.1:5432/ntou_integration
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run format:check
      - run: python -m ruff format --check app notification_worker scripts tests
      - run: python -m ruff check app notification_worker scripts tests
      - name: Reserve PostgreSQL capacity for 100 independent transactions
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U test_owner -d ntou_integration -c "ALTER SYSTEM SET max_connections = '120'"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U test_owner -d ntou_integration; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: python -m scripts.create_test_databases
      - run: python -m pytest tests -q --junitxml=reports/pytest.xml
      - run: python scripts/audit_dependencies.py
      - run: npm audit --audit-level=high
      - run: npx --yes deno@2.9.6 check supabase/functions/dispatch-push/index.ts scripts/generate-vapid.ts
      - run: npx --yes deno@2.9.6 test supabase/functions/dispatch-push/security_test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-validation-reports
          path: reports/
