project_id = "ntou-classroom"

[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173/auth/callback",
  "http://localhost:5173/auth/callback"
]
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/ntou_google_signup_gate"

# This server-to-server endpoint authenticates both apikey and dispatch secret.
# It accepts secret keys, so the platform's user-JWT gate is disabled.
[functions.dispatch-push]
verify_jwt = false
